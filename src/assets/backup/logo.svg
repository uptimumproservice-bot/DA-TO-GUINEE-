<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 430" width="1260" height="430">
  <defs>
    <!-- Left outer frame gradient: Royal blue to dark navy -->
    <linearGradient id="dato-blue-chevron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#005FAA" />
      <stop offset="30%" stop-color="#034386" />
      <stop offset="70%" stop-color="#052654" />
      <stop offset="100%" stop-color="#02142B" />
    </linearGradient>

    <!-- Top right facet gradient: Warm golden amber -->
    <linearGradient id="dato-gold-roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <!-- Cyan inner facet gradient -->
    <linearGradient id="dato-cyan-roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#0288D1" />
    </linearGradient>

    <!-- Crimson red column gradient -->
    <linearGradient id="dato-red-tower" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>

    <!-- Emerald green column gradient -->
    <linearGradient id="dato-green-tower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>

    <!-- Dark charcoal anthracite block gradient -->
    <linearGradient id="dato-dark-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37474F" />
      <stop offset="100%" stop-color="#212121" />
    </linearGradient>
  </defs>

  <!-- ========================================== -->
  <!-- 1. 3D ISOMETRIC HEXAGON EMBLEM              -->
  <!-- ========================================== -->

  <!-- Left outer shell (Navy blue frame with progressive gradient) -->
  <path 
    d="M 165,25 L 35,215 L 165,405 L 165,355 L 75,215 L 165,75 Z" 
    fill="url(#dato-blue-chevron)" 
  />

  <!-- Top right golden amber facet -->
  <path 
    d="M 165,25 L 295,98 L 295,146 L 165,73 Z" 
    fill="url(#dato-gold-roof)" 
  />

  <!-- Cyan inner roof facet -->
  <path 
    d="M 165,88 L 295,160 L 295,208 L 165,136 Z" 
    fill="url(#dato-cyan-roof)" 
  />

  <!-- Red column (1st inner tower) -->
  <path 
    d="M 100,173 L 150,144 L 150,334 L 100,363 Z" 
    fill="url(#dato-red-tower)" 
  />

  <!-- Green column (2nd inner tower) -->
  <path 
    d="M 163,192 L 213,163 L 213,353 L 163,382 Z" 
    fill="url(#dato-green-tower)" 
  />

  <!-- Anthracite block (3rd inner tower) -->
  <path 
    d="M 240,250 L 295,282 L 295,320 L 240,288 Z" 
    fill="url(#dato-dark-facet)" 
  />

  <!-- ========================================== -->
  <!-- 2. VERTICAL NAVY SEPARATOR LINE             -->
  <!-- ========================================== -->
  <line 
    x1="345" 
    y1="40" 
    x2="345" 
    y2="390" 
    stroke="#0A2540" 
    stroke-width="4.5" 
    stroke-linecap="round" 
  />

  <!-- ========================================== -->
  <!-- 3. WORDMARK: DA-TO                         -->
  <!-- ========================================== -->
  <g fill="#0A2540">
    <!-- Letter 'D' -->
    <path d="M 405,60 L 500,60 C 555,60 585,92 585,137 C 585,182 555,214 500,214 L 405,214 Z M 447,92 L 447,182 L 495,182 C 530,182 547,166 547,137 C 547,108 530,92 495,92 Z" />

    <!-- Letter 'A' (Chevron / with no crossbar) -->
    <path d="M 660,60 L 688,60 L 757,214 L 711,214 L 674,128 L 637,214 L 591,214 Z" />

    <!-- Hyphen '-' -->
    <rect x="785" y="122" width="58" height="28" rx="3" />

    <!-- Letter 'T' -->
    <path d="M 870,60 L 1010,60 L 1010,92 L 960,92 L 960,214 L 920,214 L 920,92 L 870,92 Z" />

    <!-- Letter 'O' -->
    <path d="M 1115,60 C 1173,60 1203,90 1203,137 C 1203,184 1173,214 1115,214 C 1057,214 1027,184 1027,137 C 1027,90 1057,60 1115,60 Z M 1115,92 C 1143,92 1165,109 1165,137 C 1165,165 1143,182 1115,182 C 1087,182 1065,165 1065,137 C 1065,109 1087,92 1115,92 Z" />
  </g>

  <!-- ========================================== -->
  <!-- 4. SUBTITLE: ——  G U I N É E  ——           -->
  <!-- ========================================== -->
  <!-- Left rule -->
  <line x1="405" y1="270" x2="565" y2="270" stroke="#0A2540" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Vector paths for G U I N É E to guarantee 100% exact rendering -->
  <g fill="#0A2540">
    <!-- G -->
    <path d="M 660,250 L 660,265 C 652,260 643,257 632,257 C 616,257 605,268 605,283 C 605,298 616,309 632,309 C 643,309 651,305 657,298 L 657,288 L 634,288 L 634,277 L 671,277 L 671,308 C 661,316 648,321 632,321 C 607,321 590,304 590,283 C 590,262 607,245 632,245 C 647,245 655,248 660,250 Z" />
    
    <!-- U -->
    <path d="M 690,247 L 703,247 L 703,292 C 703,303 710,309 721,309 C 732,309 739,303 739,292 L 739,247 L 752,247 L 752,292 C 752,312 739,321 721,321 C 703,321 690,312 690,292 Z" />
    
    <!-- I -->
    <path d="M 773,247 L 786,247 L 786,320 L 773,320 Z" />
    
    <!-- N -->
    <path d="M 815,247 L 828,247 L 859,300 L 859,247 L 872,247 L 872,320 L 859,320 L 828,267 L 828,320 L 815,320 Z" />
    
    <!-- É -->
    <path d="M 900,247 L 939,247 L 939,259 L 913,259 L 913,277 L 935,277 L 935,289 L 913,289 L 913,308 L 939,308 L 939,320 L 900,320 Z" />
    <!-- Acute accent over E -->
    <path d="M 915,240 L 931,226 L 936,230 L 920,244 Z" />
    
    <!-- E -->
    <path d="M 967,247 L 1006,247 L 1006,259 L 980,259 L 980,277 L 1002,277 L 1002,289 L 980,289 L 980,308 L 1006,308 L 1006,320 L 967,320 Z" />
  </g>
  
  <!-- Right rule -->
  <line x1="1043" y1="270" x2="1203" y2="270" stroke="#0A2540" stroke-width="4.5" stroke-linecap="round" />

  <!-- ========================================== -->
  <!-- 5. SLOGAN: Construire durablement...        -->
  <!-- ========================================== -->
  <text 
    x="405" 
    y="378" 
    textLength="798" 
    lengthAdjust="spacingAndGlyphs"
    font-family="'Inter', 'Montserrat', 'Liberation Sans', sans-serif" 
    font-size="33" 
    font-weight="500" 
    fill="#0A2540"
  >Construire durablement. Créer de la valeur.</text>
</svg>